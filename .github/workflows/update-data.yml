name: 自动更新数据
on:
  schedule:
    - cron: '30 0 * * 1-5'
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-etf-data
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取并合并数据
        run: python scripts/update_cloud.py
      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf-data.json
          if git diff --quiet --cached; then
            echo "数据没有变化，跳过提交"
          else
            git commit -m "自动更新数据: $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi
